name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://sillon:sillon@localhost:5432/sillon_dev?schema=public
  TEST_DATABASE_URL: postgresql://sillon:sillon@localhost:5432/sillon_test?schema=public
  SESSION_SECRET: secret-integration-continue-32-car

jobs:
  verification:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sillon
          POSTGRES_PASSWORD: sillon
          POSTGRES_DB: sillon_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sillon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Préparer la base de test
        run: |
          PGPASSWORD=sillon psql -h localhost -U sillon -d sillon_dev -c 'CREATE DATABASE sillon_test;'
          for db in sillon_dev sillon_test; do
            PGPASSWORD=sillon psql -h localhost -U sillon -d "$db" \
              -c 'CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS ltree;'
          done

      - run: npm run build -w @sillon/core
      - run: npm run db:migrate -w @sillon/api
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build

      - name: Tests de bout en bout (smartphone et bureau)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  conformite-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les en-têtes REUSE (SPDX)
        uses: fsfe/reuse-action@v5

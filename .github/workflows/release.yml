#
# Versionnage et publication automatiques.
#
# release-please lit les commits conventionnels fusionnés sur `main` et tient à jour une
# « PR de release » : elle accumule le CHANGELOG et le numéro de version. Fusionner cette
# PR crée le tag `vX.Y.Z` et la GitHub Release ; c'est à ce moment seulement que les
# images Docker partent sur ghcr.io. Rien ne se publie sans cette fusion.
name: Release

on:
  push:
    branches: [main]

# Un seul enchaînement de release à la fois : deux fusions rapprochées ne doivent pas
# construire deux jeux d'images concurrents.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparer:
    name: PR de release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publiee: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Image ${{ matrix.image }}
    needs: preparer
    if: needs.preparer.outputs.publiee == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # Le tag vient d'être posé par le travail précédent : on construit exactement
          # le code publié, pas la pointe de `main`.
          ref: ${{ needs.preparer.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadonnees
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `0.2.0`, `0.2`, `0` et `latest` : on peut épingler aussi finement qu'on veut.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preparer.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preparer.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.preparer.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Sillon ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

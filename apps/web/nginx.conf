server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Résolveur interne de Docker, avec une durée de validité courte.
  #
  # Sans lui, nginx résout `api` **une seule fois, à son démarrage**, et garde l'adresse.
  # Or `docker compose up -d api` recrée le conteneur avec une autre adresse : nginx
  # continue alors d'écrire à une adresse vide et rend des 502, tandis que le nom se
  # résout parfaitement depuis le même conteneur. La page s'affiche, seule la connexion
  # échoue, et rien ne dit pourquoi — il fallait savoir qu'il fallait redémarrer nginx.
  #
  # `ipv6=off` : le réseau par défaut de Docker n'attribue pas d'adresse IPv6, et une
  # résolution AAAA vaine ajoute une attente à chaque requête.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # L'API est servie sur le même domaine : cookies de session en SameSite=Lax, sans CORS.
  location /api/ {
    # L'amont passe par une variable : c'est **cela** qui force nginx à consulter le
    # résolveur à chaque requête au lieu de figer l'adresse au démarrage. Avec une
    # variable, nginx ne reconstruit plus l'URI tout seul : `$request_uri` la rend telle
    # quelle, paramètres de requête compris.
    set $amont_api http://api:3000;
    proxy_pass $amont_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    set $amont_docs http://api:3000;
    proxy_pass $amont_docs$request_uri;
    proxy_set_header Host $host;
  }

  # Le service worker ne doit jamais être servi depuis un cache HTTP périmé.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

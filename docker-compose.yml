#
# Environnement de développement complet : `docker compose up`.
# La base est créée avec les extensions citext, unaccent et ltree, puis un rôle applicatif
# ordinaire (`sillon_app`) distinct du superutilisateur de l'image : c'est sous ce rôle que
# l'API se connecte, donc c'est lui qui subit les politiques RLS. Voir infra/postgres-init.sql.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sillon
      POSTGRES_PASSWORD: sillon
      POSTGRES_DB: sillon_dev
    # Port publié sur la machine hôte. Configurable, parce qu'un poste de développement a
    # souvent déjà un PostgreSQL sur 5432 : `DB_PORT=5433 docker compose up` suffit alors.
    # Les conteneurs, eux, se joignent par le réseau interne et ne dépendent pas de ce port.
    ports: ['${DB_PORT:-5432}:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sillon -d sillon_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # File des tâches de fond (BullMQ) : les courriels y passent, les exports volumineux
    # et la régénération massive des tâches y passeront.
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Tout ce que `.env` contient arrive dans le conteneur.
    #
    # Énumérer les variables une par une a produit le même défaut trois fois : un réglage
    # posé dans `.env` — `SMTP_URL`, `ACCESS_POLICY`, `MAP_TILE_NAME` — n'arrivait pas
    # jusqu'ici et restait sans effet, **en silence**. Les `environment:` ci-dessous
    # gardent la priorité : ils désignent des services du réseau interne, que la machine
    # hôte ne sait pas joindre.
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sillon_app:sillon@db:5432/sillon_dev?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-changez-moi-en-production-32-caracteres}
      # L'adresse où l'on atteint l'interface, et donc la base des liens envoyés par
      # courriel. Sans elle, l'API retombait sur le port 5173 de Vite : le lien de
      # confirmation reçu à l'inscription était injoignable, puisque `docker compose`
      # sert l'interface sur 8080.
      #
      # `localhost` ne convient que depuis la machine qui héberge. Pour essayer depuis un
      # téléphone du réseau local, ou pour déployer, posez `APP_URL` dans `.env` :
      # sans quoi les liens de confirmation pointeraient vers l'appareil qui les ouvre,
      # c'est-à-dire nulle part. `CORS_ORIGINS` suit `APP_URL` par défaut — les deux
      # désignent la même interface, et les désaccorder n'a de sens que si l'interface est
      # servie depuis plusieurs adresses.
      #
      # À défaut des deux, on retombe sur `WEB_PORT`, sans quoi en changer casserait les
      # liens et le partage d'origine.
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-8080}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-http://localhost:${WEB_PORT:-8080}}}
      COOKIE_SECURE: 'false'
      NODE_ENV: production
      PORT: '3000'
      UPLOAD_DIR: /data/uploads
      # Un réglage qui n'arrive pas jusqu'au conteneur n'existe pas : ces trois-là se
      # posent dans `.env`, et seraient sinon ignorés sans que rien ne le dise.
      # `GEOCODING=none` coupe la seule requête que Sillon adresse à un tiers.
      GEOCODING: ${GEOCODING:-ban}
      GEOCODING_URL: ${GEOCODING_URL:-https://api-adresse.data.gouv.fr/search/}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    ports: ['${API_PORT:-3000}:3000']
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Tout ce que `.env` contient arrive dans le conteneur.
    #
    # Énumérer les variables une par une a produit le même défaut trois fois : un réglage
    # posé dans `.env` — `SMTP_URL`, `ACCESS_POLICY`, `MAP_TILE_NAME` — n'arrivait pas
    # jusqu'ici et restait sans effet, **en silence**. Les `environment:` ci-dessous
    # gardent la priorité : ils désignent des services du réseau interne, que la machine
    # hôte ne sait pas joindre.
    env_file:
      - path: .env
        required: false
    # Même image que l'API, autre commande : il vide la file au lieu de servir des requêtes.
    # Sans lui, les courriels s'empilent dans Redis sans jamais partir.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://sillon_app:sillon@db:5432/sillon_dev?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-changez-moi-en-production-32-caracteres}
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['${WEB_PORT:-8080}:80']
    depends_on: [api]

volumes:
  db-data:
  uploads:

#
# Environnement de développement complet : `docker compose up`.
# La base est créée avec les extensions citext, unaccent et ltree, puis un rôle applicatif
# ordinaire (`sillon_app`) distinct du superutilisateur de l'image : c'est sous ce rôle que
# l'API se connecte, donc c'est lui qui subit les politiques RLS. Voir infra/postgres-init.sql.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sillon
      POSTGRES_PASSWORD: sillon
      POSTGRES_DB: sillon_dev
    ports: ['5432:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sillon -d sillon_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # File des tâches de fond (BullMQ) : les courriels y passent, les exports volumineux
    # et la régénération massive des tâches y passeront.
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sillon_app:sillon@db:5432/sillon_dev?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-changez-moi-en-production-32-caracteres}
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: 'false'
      NODE_ENV: production
      PORT: '3000'
      UPLOAD_DIR: /data/uploads
    ports: ['3000:3000']
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Même image que l'API, autre commande : il vide la file au lieu de servir des requêtes.
    # Sans lui, les courriels s'empilent dans Redis sans jamais partir.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://sillon_app:sillon@db:5432/sillon_dev?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-changez-moi-en-production-32-caracteres}
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:80']
    depends_on: [api]

volumes:
  db-data:
  uploads:
